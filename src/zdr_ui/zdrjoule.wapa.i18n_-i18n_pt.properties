troubleshootingODataInactiveStep3=Utilize uma lista de tarefas Ativa\u00e7\u00e3o r\u00e1pida (STC01 / STC02) para ativar o cat\u00e1logo ou a fun\u00e7\u00e3o empresarial \u2013 isso ativa o servi\u00e7o OData de forma consistente.                       
                                                                                                                                                                                                                                                               
# OData Authorization issue                                                                                                                                                                                                                                    
troubleshootingODataUnauthorizedTitle=Os servi\u00e7os OData t\u00eam autoriza\u00e7\u00e3o em falta                                                                                                                                                           
troubleshootingODataUnauthorizedDesc=Os seguintes servi\u00e7os OData est\u00e3o ativos, mas o usu\u00e1rio atual n\u00e3o tem autoriza\u00e7\u00e3o: {0}.                                                                                                     
troubleshootingODataUnauthorizedStep1=Clique em "Analisar autoriza\u00e7\u00e3o OData em falta" (bot\u00e3o acima) para identificar as fun\u00e7\u00f5es na empresa que cont\u00eam o servi\u00e7o OData afetado.                                              
troubleshootingODataUnauthorizedStep2=Atribua o cat\u00e1logo empresarial relevante a uma fun\u00e7\u00e3o PFCG e certifique-se de que os valores propostos de autoriza\u00e7\u00e3o s\u00e3o atualizados e a fun\u00e7\u00e3o \u00e9 gerada.                  
troubleshootingODataUnauthorizedStep3=Atribua a fun\u00e7\u00e3o PFCG ao usu\u00e1rio (diretamente ou por meio da fun\u00e7\u00e3o composta) e teste novamente.                                                                                                
                                                                                                                                                                                                                                                               
# TM Activation \u2014 fully inactive (Error)                                                                                                                                                                                                                  
troubleshootingTMInactiveTitle=App(s) SAPUI5/mapeamento(s) de destino est\u00e3o inativos                                                                                                                                                                      
troubleshootingTMInactiveDesc=Os seguintes aplicativos n\u00e3o est\u00e3o ativos: {0}. O mapeamento de destino n\u00e3o tem um bloco ativo no launchpad do SAP Fiori.                                                                                         
troubleshootingTMInactiveStep1=Clique em "Analisar TMs em falta" (bot\u00e3o acima) para encontrar o cat\u00e1logo empresarial e a fun\u00e7\u00e3o empresarial \u00e0 qual o app pertence.                                                                    
troubleshootingTMInactiveStep2=Execute uma lista de tarefas Ativa\u00e7\u00e3o r\u00e1pida (STC01 / STC02) para o cat\u00e1logo ou fun\u00e7\u00e3o empresarial identificada para ativar todo o conte\u00fado Fiori e n\u00f3s ICF necess\u00e1rios.           
troubleshootingTMInactiveStep3=Verifique se o bloco do app aparece no launchpad do SAP Fiori e se o servi\u00e7o OData tamb\u00e9m est\u00e1 ativo.                                                                                                            
                                                                                                                                                                                                                                                               
# TM Activation \u2014 partially inactive (Warning)                                                                                                                                                                                                            
troubleshootingTMWarningTitle=App(s) SAPUI5 tem depend\u00eancias inativas                                                                                                                                                                                     
troubleshootingTMWarningDesc=Os seguintes apps est\u00e3o ativos, mas t\u00eam depend\u00eancias inativas (por exemplo, componentes integrados ou servi\u00e7os OData): {0}.                                                                                   
troubleshootingTMWarningStep1=Clique em "Analisar TMs em falta" (bot\u00e3o acima) para identificar o cat\u00e1logo ou a fun\u00e7\u00e3o empresarial afetada.                                                                                                 
troubleshootingTMWarningStep2=Utilize uma lista de tarefas Ativa\u00e7\u00e3o r\u00e1pida (STC01 / STC02) para ativar todo o conte\u00fado para o cat\u00e1logo ou fun\u00e7\u00e3o empresarial identificada.                                                  
troubleshootingTMWarningStep3=Verifique se todos os status de depend\u00eancia ficam verdes na pr\u00f3xima atualiza\u00e7\u00e3o.                                                                                                                             
                                                                                                                                                                                                                                                               
# TM Authorization issue                                                                                                                                                                                                                                       
troubleshootingTMUnauthorizedTitle=App(s) SAPUI5/mapeamento(s) de destino n\u00e3o autorizado(s)                                                                                                                                                               
troubleshootingTMUnauthorizedDesc=Os seguintes apps est\u00e3o ativos, mas o usu\u00e1rio atual n\u00e3o tem a autoriza\u00e7\u00e3o necess\u00e1ria: {0}.                                                                                                     
troubleshootingTMUnauthorizedStep1=Clique em "Analisar TMs em falta" (bot\u00e3o acima) para encontrar o cat\u00e1logo empresarial e a fun\u00e7\u00e3o empresarial que cont\u00eam o mapeamento de destino.                                                   
troubleshootingTMUnauthorizedStep2=Ative o cat\u00e1logo empresarial/fun\u00e7\u00e3o empresarial identificada usando uma lista de tarefas Ativa\u00e7\u00e3o r\u00e1pida (STC01 / STC02) para garantir que a fun\u00e7\u00e3o PFCG est\u00e1 atualizada corre+
tamente.                                                                                                                                                                                                                                                       
troubleshootingTMUnauthorizedStep3=Atribua a fun\u00e7\u00e3o PFCG gerada ao usu\u00e1rio (ou fun\u00e7\u00e3o composta) e teste novamente o acesso.                                                                                                           
                                                                                                                                                                                                                                                               
