# OData Activation issue                                                                                                                                                                                                                                       
troubleshootingODataInactiveTitle=OData Service(s) are Inactive                                                                                                                                                                                                
troubleshootingODataInactiveDesc=The following OData service(s) are not active: {0}. Inactive services will cause the scenario to fail at runtime.                                                                                                             
troubleshootingODataInactiveStep1=Open SAP Fiori Apps Reference Library and search for the app linked to this scenario.                                                                                                                                        
troubleshootingODataInactiveStep2=Identify the required OData service and the business catalog / business role it belongs to.                                                                                                                                  
troubleshootingODataInactiveStep3=Use a Rapid Activation task list (STC01 / STC02) to activate the catalog or business role \u2014 this activates the OData service consistently.                                                                              
                                                                                                                                                                                                                                                               
# OData Authorization issue                                                                                                                                                                                                                                    
troubleshootingODataUnauthorizedTitle=OData Service(s) have Missing Authorization                                                                                                                                                                              
troubleshootingODataUnauthorizedDesc=The following OData service(s) are active but the current user is not authorized: {0}.                                                                                                                                    
troubleshootingODataUnauthorizedStep1=Click "Analyze Missing OData Auth" (button above) to identify the business roles that contain the affected OData service.                                                                                                
troubleshootingODataUnauthorizedStep2=Assign the relevant business catalog to a PFCG role and ensure authorization defaults are maintained and role is generated.                                                                                              
troubleshootingODataUnauthorizedStep3=Assign the PFCG role to the user (directly or via composite role) and re-test.                                                                                                                                           
                                                                                                                                                                                                                                                               
# TM Activation \u2014 fully inactive (Error)                                                                                                                                                                                                                  
troubleshootingTMInactiveTitle=SAPUI5 App(s) / IBN Target(s) are Inactive                                                                                                                                                                                      
troubleshootingTMInactiveDesc=The following app(s) are not active: {0}. The target mapping has no active tile in Fiori Launchpad.                                                                                                                              
troubleshootingTMInactiveStep1=Click "Analyse Missing IBN Targets" (button above) to find the business catalog and business role the app belongs to.                                                                                                           
troubleshootingTMInactiveStep2=Run a Rapid Activation task list (STC01 / STC02) for the identified catalog or business role to activate all required Fiori content and ICF nodes.                                                                              
troubleshootingTMInactiveStep3=Verify the app tile appears in Fiori Launchpad and that the OData service is also active.                                                                                                                                       
                                                                                                                                                                                                                                                               
# TM Activation \u2014 partially inactive (Warning)                                                                                                                                                                                                            
troubleshootingTMWarningTitle=SAPUI5 App(s) have Inactive Dependencies                                                                                                                                                                                         
troubleshootingTMWarningDesc=The following app(s) are active but have inactive dependencies (e.g. embedded components or OData services): {0}.                                                                                                                 
troubleshootingTMWarningStep1=Click "Analyse Missing IBN Targets" (button above) to identify the affected catalog or business role.                                                                                                                            
troubleshootingTMWarningStep2=Use a Rapid Activation task list (STC01 / STC02) to activate all content for the identified catalog or business role.                                                                                                            
troubleshootingTMWarningStep3=Verify all dependency statuses turn green on the next refresh.                                                                                                                                                                   
                                                                                                                                                                                                                                                               
# TM Authorization issue                                                                                                                                                                                                                                       
troubleshootingTMUnauthorizedTitle=SAPUI5 App(s) / IBN Target(s) not Authorized                                                                                                                                                                                
troubleshootingTMUnauthorizedDesc=The following app(s) are active but the current user lacks the required authorization: {0}.                                                                                                                                  
troubleshootingTMUnauthorizedStep1=Click "Analyse Missing IBN Targets" (button above) to find the business catalog and business role containing the IBN Target.                                                                                                
troubleshootingTMUnauthorizedStep2=Activate the identified business catalog / business role using a Rapid Activation task list (STC01 / STC02) to ensure the PFCG role is correctly maintained.                                                                
troubleshootingTMUnauthorizedStep3=Assign the generated PFCG role to the user (or composite role) and re-test access.                                                                                                                                          
                                                                                                                                                                                                                                                               
